services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: larago_lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell or .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d larago_lms"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      # URL-encode special characters if constructing DATABASE_URL yourself.
      DATABASE_URL: "postgres://lms:${POSTGRES_PASSWORD}@db:5432/larago_lms?sslmode=disable"
      LISTEN_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/static
      DEMO_SEED: ${DEMO_SEED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
volumes:
  postgres_data:
